<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 896" width="860" height="896" role="img" aria-label="Developers, scripts and visitors reach one server process. It starts apps through a small supervisor each, or through a container engine."><title>Developers, scripts and visitors reach one server process. It starts apps through a small supervisor each, or through a container engine.</title><rect width="860" height="896" fill="#111419"/><rect x="40" y="16" width="240" height="74" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="43" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Developers</text><text x="54" y="65" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">git push, and moor</text><rect x="310" y="16" width="240" height="74" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="324" y="43" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">CI and scripts</text><text x="324" y="65" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">the API, with a token</text><rect x="580" y="16" width="240" height="74" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="594" y="43" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Visitors</text><text x="594" y="65" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">a browser</text><rect x="20" y="122" width="820" height="530" rx="14" fill="#12322f" stroke="#4cc4b8" stroke-width="1.5"/><text x="40" y="638" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#4cc4b8" text-anchor="start">The moor server: one process</text><rect x="40" y="144" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Git server</text><text x="54" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">SSH and HTTPS</text><text x="54" y="213" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">shows the build as it goes</text><rect x="310" y="144" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="324" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">API and console</text><text x="324" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">REST, streams, a WebSocket</text><text x="324" y="213" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">pages rendered here</text><rect x="580" y="144" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="594" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Ingress</text><text x="594" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">TLS, hostnames, gates</text><text x="594" y="213" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">static files, proxy, waking</text><rect x="40" y="268" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Forges</text><text x="54" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">webhooks, and looking</text><text x="54" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">for changes; reports back</text><rect x="310" y="268" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="324" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Deployments</text><text x="324" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">a queue per environment</text><text x="324" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">build, release, rollout</text><rect x="580" y="268" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="594" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Toolchains</text><text x="594" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">Go, Node.js, uv, Python</text><text x="594" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">downloaded and checked</text><rect x="40" y="392" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Logs and metrics</text><text x="54" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">health, notifications</text><text x="54" y="461" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">telemetry to elsewhere</text><rect x="310" y="392" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="324" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Reconciler</text><text x="324" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">what should run, and</text><text x="324" y="461" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">what does: starts, stops</text><rect x="580" y="392" width="240" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="594" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Scheduler</text><text x="594" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">cron, sleep, expiry</text><text x="594" y="461" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">backups, tidying up</text><rect x="40" y="512" width="780" height="96" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="539" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">The store</text><text x="54" y="561" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">One SQLite database for what is a record,</text><text x="54" y="581" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">and plain files for everything else: repositories, builds, logs and apps’ data.</text><line x1="120" y1="90" x2="120" y2="140" stroke="#a3adb9" stroke-width="1.6"/><polygon points="120,144 124.34965534111231,134.99552897647322 115.6503446588877,134.99552897647322" fill="#a3adb9"/><text x="128" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a3adb9" text-anchor="start">git push</text><line x1="250" y1="90" x2="346.4803784093712" y2="142.09940434106048" stroke="#a3adb9" stroke-width="1.6"/><polygon points="350,144 344.1436513581513,135.8942501528164 340.01018332855074,143.5488205780027" fill="#a3adb9"/><text x="312" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a3adb9" text-anchor="start">moor</text><line x1="470" y1="90" x2="470" y2="140" stroke="#a3adb9" stroke-width="1.6"/><polygon points="470,144 474.3496553411123,134.99552897647322 465.6503446588877,134.99552897647322" fill="#a3adb9"/><line x1="700" y1="90" x2="700" y2="140" stroke="#a3adb9" stroke-width="1.6"/><polygon points="700,144 704.3496553411123,134.99552897647322 695.6503446588877,134.99552897647322" fill="#a3adb9"/><line x1="280" y1="220" x2="308.3447882227953" y2="282.3585340901496" stroke="#a3adb9" stroke-width="1.6"/><polygon points="310,286 310.2337037896547,276.0027312460502 302.31414296752513,279.6025316197455" fill="#a3adb9"/><line x1="430" y1="240" x2="430" y2="264" stroke="#a3adb9" stroke-width="1.6"/><polygon points="430,268 434.3496553411123,258.9955289764732 425.6503446588877,258.9955289764732" fill="#a3adb9"/><line x1="280" y1="316" x2="306" y2="316" stroke="#a3adb9" stroke-width="1.6"/><polygon points="310,316 300.9955289764732,311.6503446588877 300.9955289764732,320.3496553411123" fill="#a3adb9"/><line x1="550" y1="316" x2="576" y2="316" stroke="#a3adb9" stroke-width="1.6"/><polygon points="580,316 570.9955289764732,311.6503446588877 570.9955289764732,320.3496553411123" fill="#a3adb9"/><line x1="430" y1="364" x2="430" y2="388" stroke="#a3adb9" stroke-width="1.6"/><polygon points="430,392 434.3496553411123,382.9955289764732 425.6503446588877,382.9955289764732" fill="#a3adb9"/><line x1="580" y1="440" x2="554" y2="440" stroke="#a3adb9" stroke-width="1.6"/><polygon points="550,440 559.0044710235268,444.3496553411123 559.0044710235268,435.6503446588877" fill="#a3adb9"/><rect x="40" y="698" width="370" height="74" rx="10" fill="#17293b" stroke="#7ab3e6" stroke-width="1.5"/><text x="54" y="725" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">A small supervisor for each instance</text><text x="54" y="747" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">outlives the server, and restarts what fails</text><rect x="40" y="804" width="370" height="74" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="54" y="831" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Your app</text><text x="54" y="853" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">an ordinary process, on 127.0.0.1</text><rect x="450" y="698" width="370" height="74" rx="10" fill="#17293b" stroke="#7ab3e6" stroke-width="1.5"/><text x="464" y="725" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Podman or Docker</text><text x="464" y="747" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">only if you use containers</text><rect x="450" y="804" width="370" height="74" rx="10" fill="#20262f" stroke="#3a434f" stroke-width="1.5"/><text x="464" y="831" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="start">Your app</text><text x="464" y="853" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="start">in a container, on 127.0.0.1</text><line x1="225" y1="652" x2="225" y2="694" stroke="#a3adb9" stroke-width="1.6"/><polygon points="225,698 229.3496553411123,688.9955289764732 220.6503446588877,688.9955289764732" fill="#a3adb9"/><text x="233" y="680" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a3adb9" text-anchor="start">starts</text><line x1="635" y1="652" x2="635" y2="694" stroke="#a3adb9" stroke-width="1.6"/><polygon points="635,698 639.3496553411123,688.9955289764732 630.6503446588877,688.9955289764732" fill="#a3adb9"/><text x="643" y="680" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a3adb9" text-anchor="start">starts</text><line x1="225" y1="772" x2="225" y2="800" stroke="#a3adb9" stroke-width="1.6"/><polygon points="225,804 229.3496553411123,794.9955289764732 220.6503446588877,794.9955289764732" fill="#a3adb9"/><line x1="635" y1="772" x2="635" y2="800" stroke="#a3adb9" stroke-width="1.6"/><polygon points="635,804 639.3496553411123,794.9955289764732 630.6503446588877,794.9955289764732" fill="#a3adb9"/></svg>

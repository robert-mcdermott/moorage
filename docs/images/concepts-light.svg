<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-label="An app has environments. Each has an address, variables and a data directory, and a current release. A release is a build and a set of variables, and instances run it."><title>An app has environments. Each has an address, variables and a data directory, and a current release. A release is a build and a set of variables, and instances run it.</title><rect width="860" height="410" fill="#ffffff"/><rect x="16" y="104" width="124" height="96" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="30" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">An app</text><text x="30" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">tasks</text><text x="30" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">a repository</text><rect x="176" y="16" width="300" height="282" rx="12" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.5"/><text x="192" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="650" fill="#555f6e" text-anchor="start">Its environments</text><rect x="192" y="58" width="268" height="72" rx="10" fill="#e0f1f0" stroke="#0b7372" stroke-width="1.5"/><text x="206" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#0b7372" text-anchor="start">production</text><text x="206" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">tasks.apps.example.com</text><rect x="192" y="138" width="268" height="68" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="206" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">staging</text><text x="206" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">tasks--staging.apps.example.com</text><rect x="192" y="214" width="268" height="68" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="206" y="241" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">a preview of a branch</text><text x="206" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">tasks--new-title.apps.example.com</text><line x1="140" y1="152" x2="172" y2="152" stroke="#555f6e" stroke-width="1.6"/><polygon points="176,152 166.99552897647322,147.6503446588877 166.99552897647322,156.3496553411123" fill="#555f6e"/><rect x="524" y="16" width="320" height="196" rx="12" fill="#f5f6f8" stroke="#c6ccd5" stroke-width="1.5"/><text x="540" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="650" fill="#555f6e" text-anchor="start">Its current release: v8</text><rect x="540" y="58" width="140" height="138" rx="10" fill="#e3eef8" stroke="#2a6aa3" stroke-width="1.5"/><text x="554" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">A build</text><text x="554" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">fixed once</text><text x="554" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">it is made,</text><text x="554" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">and kept for</text><text x="554" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">rollbacks</text><rect x="688" y="58" width="140" height="138" rx="10" fill="#e3eef8" stroke="#2a6aa3" stroke-width="1.5"/><text x="702" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">Variables</text><text x="702" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">and secrets,</text><text x="702" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">as they were</text><text x="702" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">then</text><line x1="460" y1="94" x2="520" y2="94" stroke="#555f6e" stroke-width="1.6"/><polygon points="524,94 514.9955289764732,89.6503446588877 514.9955289764732,98.3496553411123" fill="#555f6e"/><text x="492" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#555f6e" text-anchor="middle">runs</text><rect x="524" y="240" width="152" height="72" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="538" y="267" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">web.1</text><text x="538" y="289" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">an instance</text><rect x="692" y="240" width="152" height="72" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="706" y="267" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">worker.1</text><text x="706" y="289" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">an instance</text><line x1="610" y1="212" x2="610" y2="236" stroke="#555f6e" stroke-width="1.6"/><polygon points="610,240 614.3496553411123,230.99552897647322 605.6503446588877,230.99552897647322" fill="#555f6e"/><line x1="758" y1="212" x2="758" y2="236" stroke="#555f6e" stroke-width="1.6"/><polygon points="758,240 762.3496553411123,230.99552897647322 753.6503446588877,230.99552897647322" fill="#555f6e"/><rect x="192" y="322" width="268" height="72" rx="10" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.5"/><text x="206" y="349" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="start">Its own data directory</text><text x="206" y="371" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="start">survives deploys and rollbacks</text><line x1="326" y1="298" x2="326" y2="318" stroke="#555f6e" stroke-width="1.6"/><polygon points="326,322 330.3496553411123,312.9955289764732 321.6503446588877,312.9955289764732" fill="#555f6e"/><text x="524" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#555f6e" text-anchor="start">A deploy, a change of variables, a rollback</text><text x="524" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#555f6e" text-anchor="start">or a promotion each makes a new release,</text><text x="524" y="388" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#555f6e" text-anchor="start">so that the list is the history.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" role="img" aria-label="The old release serves until the new one is healthy. Traffic then moves at once, and the old release finishes what it was doing and stops."><title>The old release serves until the new one is healthy. Traffic then moves at once, and the old release finishes what it was doing and stops.</title><rect width="860" height="344" fill="#ffffff"/><text x="20" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="650" fill="#171b22" text-anchor="start">v7, old</text><text x="20" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="650" fill="#171b22" text-anchor="start">v8, new</text><rect x="120" y="62" width="420" height="50" rx="8" fill="#e0f1f0" stroke="#0b7372" stroke-width="1.5"/><text x="330" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#0b7372" text-anchor="middle">serving</text><rect x="540" y="62" width="150" height="50" rx="8" fill="#faefd8" stroke="#8a5a00" stroke-width="1.5"/><text x="615" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#8a5a00" text-anchor="middle">finishing</text><rect x="250" y="142" width="290" height="50" rx="8" fill="#e3eef8" stroke="#2a6aa3" stroke-width="1.5"/><text x="395" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2a6aa3" text-anchor="middle">starting: health checks</text><rect x="540" y="142" width="300" height="50" rx="8" fill="#e0f1f0" stroke="#0b7372" stroke-width="1.5"/><text x="690" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#0b7372" text-anchor="middle">serving</text><line x1="540" y1="38" x2="540" y2="214" stroke="#171b22" stroke-width="2" stroke-dasharray="5 4"/><text x="540" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#171b22" text-anchor="middle">traffic moves, all at once</text><line x1="120" y1="236" x2="836" y2="236" stroke="#555f6e" stroke-width="1.6"/><polygon points="840,236 830.9955289764732,231.6503446588877 830.9955289764732,240.3496553411123" fill="#555f6e"/><line x1="250" y1="230" x2="250" y2="242" stroke="#555f6e" stroke-width="1.5"/><text x="250" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="middle">new instances start</text><line x1="540" y1="230" x2="540" y2="242" stroke="#555f6e" stroke-width="1.5"/><text x="540" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="middle">healthy</text><line x1="690" y1="230" x2="690" y2="242" stroke="#555f6e" stroke-width="1.5"/><text x="690" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#555f6e" text-anchor="middle">old ones stop</text><text x="20" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#555f6e" text-anchor="start">If v8 never becomes healthy, traffic never moves: v7 goes on serving, and</text><text x="20" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#555f6e" text-anchor="start">the deployment fails. Nobody using the app sees anything.</text></svg>

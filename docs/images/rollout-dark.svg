<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" role="img" aria-label="The old release serves until the new one is healthy. Traffic then moves at once, and the old release finishes what it was doing and stops."><title>The old release serves until the new one is healthy. Traffic then moves at once, and the old release finishes what it was doing and stops.</title><rect width="860" height="344" fill="#111419"/><text x="20" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="650" fill="#e8ebef" text-anchor="start">v7, old</text><text x="20" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="650" fill="#e8ebef" text-anchor="start">v8, new</text><rect x="120" y="62" width="420" height="50" rx="8" fill="#12322f" stroke="#4cc4b8" stroke-width="1.5"/><text x="330" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#4cc4b8" text-anchor="middle">serving</text><rect x="540" y="62" width="150" height="50" rx="8" fill="#33290f" stroke="#e0b050" stroke-width="1.5"/><text x="615" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e0b050" text-anchor="middle">finishing</text><rect x="250" y="142" width="290" height="50" rx="8" fill="#17293b" stroke="#7ab3e6" stroke-width="1.5"/><text x="395" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#7ab3e6" text-anchor="middle">starting: health checks</text><rect x="540" y="142" width="300" height="50" rx="8" fill="#12322f" stroke="#4cc4b8" stroke-width="1.5"/><text x="690" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#4cc4b8" text-anchor="middle">serving</text><line x1="540" y1="38" x2="540" y2="214" stroke="#e8ebef" stroke-width="2" stroke-dasharray="5 4"/><text x="540" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="650" fill="#e8ebef" text-anchor="middle">traffic moves, all at once</text><line x1="120" y1="236" x2="836" y2="236" stroke="#a3adb9" stroke-width="1.6"/><polygon points="840,236 830.9955289764732,231.6503446588877 830.9955289764732,240.3496553411123" fill="#a3adb9"/><line x1="250" y1="230" x2="250" y2="242" stroke="#a3adb9" stroke-width="1.5"/><text x="250" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="middle">new instances start</text><line x1="540" y1="230" x2="540" y2="242" stroke="#a3adb9" stroke-width="1.5"/><text x="540" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="middle">healthy</text><line x1="690" y1="230" x2="690" y2="242" stroke="#a3adb9" stroke-width="1.5"/><text x="690" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#a3adb9" text-anchor="middle">old ones stop</text><text x="20" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#a3adb9" text-anchor="start">If v8 never becomes healthy, traffic never moves: v7 goes on serving, and</text><text x="20" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#a3adb9" text-anchor="start">the deployment fails. Nobody using the app sees anything.</text></svg>

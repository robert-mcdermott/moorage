name: CI

# A branch gets CI from its pull request, and main and release branches from pushes. What has passed is not
# tested again: the job at the end keeps a note of the tree that passed, a later run with the same tree finds it, and only
# what has not run on it runs (.github/scripts/ci-changes.sh). So merging a pull request that is up to date with main runs
# only the slower jobs that it did not touch, and tagging that commit does not test it again. A run by hand runs everything.
on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces the run of the one before it. Main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # What this run needs to do. Everything below waits on this.
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the notes that earlier runs have left.
      actions: read
    outputs:
      tree: ${{ steps.look.outputs.tree }}
      tested: ${{ steps.look.outputs.tested }}
      code: ${{ steps.look.outputs.code }}
      docs: ${{ steps.look.outputs.docs }}
      record: ${{ steps.look.outputs.record }}
      note: ${{ steps.look.outputs.note }}
      installer: ${{ steps.look.outputs.installer }}
      trust: ${{ steps.look.outputs.trust }}
      service: ${{ steps.look.outputs.service }}
      upgrade: ${{ steps.look.outputs.upgrade }}
      isolation: ${{ steps.look.outputs.isolation }}
      backup: ${{ steps.look.outputs.backup }}
      real: ${{ steps.look.outputs.real }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: It decides as it should
        run: .github/scripts/ci-changes-check.sh
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        # With bash named, a failure in the script fails this, rather than saying nothing and having nothing run. Jobs run unless told not to.
        shell: bash
        run: .github/scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  docs:
    # For a change only to the documentation: what reads it, and the website.
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The website builds, with no broken links
        run: node docs/site/build.mjs "$RUNNER_TEMP/site"
      - name: What the tests read of it
        run: |
          go test ./internal/docs ./internal/brand
          go test ./internal/cli -run 'TestDocumented|TestCommandReference'
          go test ./internal/api -run 'TestOpenAPIDocument'

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Linux has the newest stable Go, which releases are built with, and the race detector. The others have
      # the oldest that go.mod allows. Between them, they test both.
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
      - uses: actions/setup-go@v5
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: The website builds, with no broken links
        if: runner.os == 'Linux'
        run: node docs/site/build.mjs "$RUNNER_TEMP/site"
      - name: Vet
        run: go vet ./...
      # All but the server's tests, which have a job of their own, below.
      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: go test -timeout 15m $(go list ./... | grep -v '/internal/server$')
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -timeout 15m $(go list ./... | grep -v '/internal/server$')

  test-server:
    # The server's tests start real servers, one test after another, and took 19 minutes of 22 under the race detector, and 10 of 11
    # without. So that they are not what everything waits for, each operating system runs them in parts, side by side. Each part is
    # also its own process, as it is on a machine of its own. ci-changes-check.sh holds this list to having every part of each.
    name: Server tests (${{ matrix.os }}, ${{ matrix.part }} of ${{ matrix.parts }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, part: 1, parts: 4, flags: -race }
          - { os: ubuntu-latest, part: 2, parts: 4, flags: -race }
          - { os: ubuntu-latest, part: 3, parts: 4, flags: -race }
          - { os: ubuntu-latest, part: 4, parts: 4, flags: -race }
          - { os: macos-latest, part: 1, parts: 2, flags: '' }
          - { os: macos-latest, part: 2, parts: 2, flags: '' }
          - { os: windows-latest, part: 1, parts: 2, flags: '' }
          - { os: windows-latest, part: 2, parts: 2, flags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # As for the other tests: Linux has the newest stable Go, and the others the oldest that go.mod allows.
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: stable
      - uses: actions/setup-go@v5
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
      - name: Test this part
        shell: bash
        run: .github/scripts/test-part.sh ${{ matrix.part }} ${{ matrix.parts }} ${{ matrix.flags }}

  samples:
    # Builds and deploys every sample app of testdata/apps from source, with
    # toolchains downloaded and verified on each run.
    name: Sample apps (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, deploy and roll back the sample apps
        env:
          MOORAGE_TEST_BUILDS: '1'
        run: go test ./internal/server -run TestSampleApps -v -timeout 20m

  examples:
    # Deploys every app of examples/ with the moor binary, from the app's
    # directory, and checks its pages and its API.
    name: Examples (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Deploy and check the examples
        run: .github/scripts/examples-check.sh

  containers:
    # Runs apps in containers with each engine: the driver on its own, then
    # deploys through a whole server. Hosted Ubuntu runners have both engines.
    name: Containers (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    runs-on: ubuntu-latest
    env:
      MOORAGE_TEST_CONTAINERS: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Versions
        run: ${{ matrix.engine }} version
      - name: The container driver
        run: go test ./internal/driver/container -v -count=1 -timeout 10m
      - name: Deploys in containers
        if: ${{ !cancelled() }}
        run: go test ./internal/server -run 'TestContainer' -v -count=1 -timeout 15m

  trust:
    # Puts the server's CA into each system's real trust store, and checks that
    # what uses that store accepts its certificates. It also tries the resolver
    # rule on macOS. The runner is thrown away afterwards.
    name: Trust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.trust != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A system that waits for someone to confirm would otherwise wait for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Trust the CA, and take it back
        shell: bash
        run: .github/scripts/trust-check.sh

  proxy:
    # Runs a server behind a real nginx, with the configuration moor writes.
    name: Behind nginx
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx
      - name: Deploy and push through nginx
        run: .github/scripts/proxy-check.sh

  console:
    # Tries the web console in real browsers, against a real server with a real app.
    name: Console (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Try the console
        env:
          BROWSER: ${{ matrix.browser }}
        run: .github/scripts/console-check.sh

  upgrade:
    # Takes over the data directory and running apps of a server of the last
    # published release, with this code.
    name: Upgrade (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.upgrade != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Upgrade from the last release
        run: .github/scripts/upgrade-check.sh
      # Someone may well skip a few. This is the first that could upgrade itself.
      - name: Upgrade from the oldest
        env:
          MOORAGE_UPGRADE_FROM: v0.6.0
        run: .github/scripts/upgrade-check.sh

  install-unix:
    # Runs install.sh for real, piped into a shell, against the published releases.
    name: Install (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          dash -n install.sh
          shellcheck --shell=sh install.sh
      - name: Install, upgrade and install as root
        run: .github/scripts/install-check.sh

  install-windows:
    # Runs install.ps1 for real, piped into Invoke-Expression, in Windows PowerShell
    # and PowerShell, on x64 and on Windows 11 for ARM.
    name: Install (${{ matrix.os }}, ${{ matrix.shell }})
    needs: changes
    if: needs.changes.outputs.installer != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and upgrade
        run: .github/scripts/install-check.ps1

  backup:
    # The restore drill: a real server backs itself up, loses everything but its master key, and has
    # it all back, from a directory and from a bucket on a real S3-compatible server.
    name: Restore drill
    needs: changes
    if: needs.changes.outputs.backup != 'false'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: drillaccess
      AWS_SECRET_ACCESS_KEY: drillsecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build moor
        run: go build -o moor-check ./cmd/moor
      - name: Start a service like S3
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY="$AWS_ACCESS_KEY_ID" -e RUSTFS_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" rustfs/rustfs:1.0.4-glibc
          for _ in $(seq 1 60); do
            # Any answer will do: it refuses a request with no signature, which is an answer.
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" != 000 ] && break
            sleep 1
          done
          docker logs s3 | tail -n 5
      - name: Try it
        run: python3 .github/scripts/backup-check.py "$PWD/moor-check" http://127.0.0.1:9000

  real-services:
    # Tries a real server against the real services it talks to: Gitea with real webhooks and a real fork, an OpenTelemetry
    # collector and a syslog server, each reading what it sends with its own parser, and an ACME server and a DNS server.
    name: Real services
    needs: changes
    if: needs.changes.outputs.real != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build moor
        run: go build -o moor-check ./cmd/moor
      - name: Try it
        run: python3 .github/scripts/real-services-check.py "$PWD/moor-check" gitea grpc telemetry acme

  isolation:
    # Runs a real server as root, here where that costs nothing, and tries how its apps are kept
    # apart: their users, their limits and their sandbox (spike S7).
    name: Isolation
    needs: changes
    if: needs.changes.outputs.isolation != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build moor
        run: |
          go build -o moor-check ./cmd/moor
          sudo install -m 755 moor-check /usr/local/bin/moor-check
      - name: Try it
        run: sudo python3 .github/scripts/isolation-check.py /usr/local/bin/moor-check

  service:
    # Installs the server as a system service (systemd, launchd), restarts it
    # with an app under load, and checks the app kept running (spike S2).
    name: Service (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.service != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install, deploy, restart under load, uninstall
        run: .github/scripts/service-check.sh

  service-windows:
    # The same on Windows, where a service is another kind of thing.
    name: Service (windows-latest)
    needs: changes
    if: needs.changes.outputs.service != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install, deploy, restart, upgrade, go back, uninstall
        shell: pwsh
        run: .github/scripts/service-check.ps1

  build:
    name: Build all targets without cgo
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/moor
            echo "::endgroup::"
          done

  vulncheck:
    name: Known vulnerabilities
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  passed:
    # Keeps a note that this tree has passed, and with what, so that no later run tests it again. It lasts two weeks, and is only ever a reason to do less.
    name: All passed
    needs: [changes, docs, test, test-server, samples, examples, containers, trust, proxy, console, upgrade, install-unix, install-windows, backup, real-services, isolation, service, service-windows, build, vulncheck]
    if: ${{ !cancelled() && needs.changes.outputs.note == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the note
        env:
          TREE: ${{ needs.changes.outputs.tree }}
          RECORD: ${{ needs.changes.outputs.record }}
        run: printf 'tree %s passed run %s with %s\n' "$TREE" "$GITHUB_RUN_ID" "$RECORD" > ci-passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}-${{ needs.changes.outputs.record }}
          path: ci-passed.txt
          retention-days: 14
          overwrite: true
